services:
  - type: pserv
    name: cliprank-ml
    runtime: docker
    region: ohio
    plan: 1c-2g
    dockerContext: ./services/ml
    dockerfilePath: ./services/ml/Dockerfile
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    disk:
      name: whisper-cache
      mountPath: /var/cache/huggingface
      sizeGB: 1
    envVars:
      - fromGroup: cliprank-generated-secrets
      - key: ML_TRANSCRIPTION_MODEL
        value: small
      - key: ML_TRANSCRIPTION_DEVICE
        value: cpu
      - key: ML_TRANSCRIPTION_COMPUTE_TYPE
        value: int8
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: cliprank-web
    runtime: docker
    region: ohio
    plan: 0.5c-512mb
    dockerContext: .
    dockerfilePath: ./Dockerfile.production
    dockerCommand: bin/rails server -b 0.0.0.0 -p 10000
    preDeployCommand: bin/rails db:prepare
    autoDeployTrigger: checksPass
    healthCheckPath: /up
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: cliprank-generated-secrets
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: APP_HOST
        fromService:
          type: web
          name: cliprank-web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: cliprank-db
          property: connectionString
      - key: ML_HOSTPORT
        fromService:
          type: pserv
          name: cliprank-ml
          property: hostport
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: DIRECT_MEDIA_DELIVERY
        value: "true"
      - key: SIGNUPS_ENABLED
        value: "false"
      - key: UPLOAD_ALLOWED_EMAILS
        sync: false
      - key: DAILY_UPLOAD_LIMIT
        value: "3"
      - key: MAX_UPLOAD_BYTES
        value: "262144000"
      - key: FEEDBACK_RANKING_ENABLED
        value: "true"
      - key: FEEDBACK_OPERATOR_EMAIL
        sync: false

  - type: worker
    name: cliprank-worker
    runtime: docker
    region: ohio
    plan: 0.5c-512mb
    dockerContext: .
    dockerfilePath: ./Dockerfile.production
    dockerCommand: bin/jobs start
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    envVars:
      - fromGroup: cliprank-generated-secrets
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: JOB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: cliprank-db
          property: connectionString
      - key: ML_HOSTPORT
        fromService:
          type: pserv
          name: cliprank-ml
          property: hostport
      - key: S3_ENDPOINT
        fromService:
          type: web
          name: cliprank-web
          envVarKey: S3_ENDPOINT
      - key: S3_BUCKET
        fromService:
          type: web
          name: cliprank-web
          envVarKey: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
        fromService:
          type: web
          name: cliprank-web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: cliprank-web
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: AWS_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: FEEDBACK_RANKING_ENABLED
        value: "true"

databases:
  - name: cliprank-db
    region: ohio
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []

envVarGroups:
  - name: cliprank-generated-secrets
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ML_SERVICE_TOKEN
        generateValue: true
