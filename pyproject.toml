[project]
name = "cliprank"
version = "2.0.0"
description = "Learn your own taste in clips from pairwise swipes on your phone"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "faster-whisper>=1.1",
  "sentence-transformers>=3.0",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pillow>=10",
  "qrcode>=7.4",
  "ocrmac>=1.0.1 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
cliprank = "cliprank.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cliprank*"]

[tool.setuptools.package-data]
cliprank = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
